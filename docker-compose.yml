services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "audit"]
      interval: 2s
      retries: 15
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://audit:audit@db:5432/audit
      AUDIT_JWT_SECRET: change-me-in-real-deployments-0123456789
    volumes:
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy
volumes:
  photos:
