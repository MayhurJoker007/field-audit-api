name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - name: Migrations apply cleanly on Postgres
        env:
          DATABASE_URL: postgresql+psycopg://audit:audit@localhost:5432/audit
        run: |
          alembic upgrade head
          python seed.py
          alembic downgrade base
